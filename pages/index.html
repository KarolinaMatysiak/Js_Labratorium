<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../styles/index.css" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../styles/assets/myicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../styles/assets/myicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../styles/assets/myicon.ico"
    />
    <link rel="manifest" href="../styles/assets/myicon.ico" />

    <script src="../js/main.js" type="module" async></script>

    <title>Notatnik</title>
  </head>
  <body>
    <div class="main-container">
      <div class="form-container">
        <div class="form-border">
          <form id="noteForm">
            <input
              id="noteTitle"
              class="form-element"
              name="noteTitle"
              type="text"
              placeholder="Tytuł"
              maxlength="20"
              required
            />
            <input
              id="noteTags"
              class="form-element"
              name="noteTags"
              type="text"
              placeholder="#Tagi"
              maxlength="20"
            />
            <textarea
              id="noteContent"
              class="form-element"
              name="noteContent"
              placeholder="Treść"
              required
            ></textarea>
            <input
              id="noteColor"
              class="form-element"
              name="noteColor"
              type="color"
              value="#FAFAFA"
              list="colors"
            />
            <datalist id="colors">
              <option value="#FAFAFA" label="brudna biel"></option>
              <option value="#FADADD" label="pudrowy róż"></option>
              <option value="#FAD0C7" label="czerwień"></option>
              <option value="#E4D7B9" label="capuccino"></option>
              <option value="#C9A15C" label="szczotkowane złoto"></option>
            </datalist>

            <button class="form-submit-button" type="submit" >
              Dodaj
            </button>
          </form>
        </div>
      </div>
      <div class="notes-container" id="notesContainer">
      
        
      </div>
    </div>
  </body>
</html>
