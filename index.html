<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Slider</title>
</head>
<body>
    <div class="slider-wrapper">
        <button class="slider-button prev" onclick="prevSlide()">&#10094;</button>
        
        <div class="slider-container">
            <div class="slider">
                <div class="slide">
                    <img src="https://picsum.photos/id/237/200/300" alt="Slide 1">
                </div>
                <div class="slide">
                    <img src="https://picsum.photos/id/230/200/300" alt="Slide 2">
                </div>
                <div class="slide">
                    <img src="https://picsum.photos/id/231/200/300" alt="Slide 3">
                </div>
                <div class="slide">
                    <img src="https://picsum.photos/id/232/200/300" alt="Slide 4">
                </div> 
            </div>

            <div class="slider-dots">
                <button class="dot active" onclick="showSlide(0)"></button>
                <button class="dot" onclick="showSlide(1)"></button>
                <button class="dot" onclick="showSlide(2)"></button>
                <button class="dot" onclick="showSlide(3)"></button>
            </div>

            <button class="pause-button" onclick="autoSlide()">
                <span class="play-icon">▶</span>
                <span class="pause-icon">⏸</span>
            </button>
        </div>

        <button class="slider-button next" onclick="nextSlide()">&#10095;</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
